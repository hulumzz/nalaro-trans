name: Firestore Order Contract
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: node --experimental-strip-types tests/order-parity.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Test public order against Firebase Emulator
        run: npx firebase emulators:exec --project demo-nalaro-orders --only firestore "node --experimental-strip-types tests/orders.test.mjs"
